<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project-K v2 — JavaScript Lab</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:Canvas;color:CanvasText}
main{max-width:920px;height:100vh;margin:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
header{flex:none}
h1{font-size:22px;margin:0 0 3px}.sub{opacity:.72;margin:0;font-size:13px}
.terminal{min-height:0;flex:1;display:flex;flex-direction:column;border:1px solid color-mix(in srgb,CanvasText 22%,transparent);border-radius:10px;overflow:hidden;background:color-mix(in srgb,Canvas 97%,CanvasText 3%)}
#output{flex:1;min-height:180px;margin:0;padding:14px;overflow-y:auto;white-space:pre-wrap;font:14px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}
.status{flex:none;border-top:1px solid color-mix(in srgb,CanvasText 16%,transparent);padding:7px 12px;display:flex;gap:14px;flex-wrap:wrap;font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;opacity:.82}
.status b{font-weight:650}
.input-area{flex:none}
.prompt{display:flex;align-items:flex-start;gap:8px}
.prompt-label{font:700 15px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;padding-top:9px}
textarea{flex:1;width:100%;min-height:86px;max-height:180px;resize:vertical;padding:9px 10px;border-radius:8px;border:1px solid color-mix(in srgb,CanvasText 25%,transparent);font:14px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;background:Canvas;color:CanvasText}
.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:7px;padding-left:30px}
button,select{padding:7px 10px;border-radius:7px;border:1px solid color-mix(in srgb,CanvasText 25%,transparent);background:Canvas;color:CanvasText;font:13px system-ui,sans-serif}
button{cursor:pointer}.primary{font-weight:700}
select{max-width:260px}
.hint{font-size:12px;opacity:.68;margin-left:auto}
@media(max-width:650px){
  main{padding:10px}
  .hint{width:100%;margin-left:0}
  .controls{padding-left:0}
}
</style>
</head>
<body>
<main>
<header>
  <h1>Project-K v2 — JavaScript Lab</h1>
  <p class="sub">Browser REPL · the browser is the host, Project K is the kernel.</p>
</header>

<section class="terminal" aria-label="REPL transcript">
  <pre id="output"></pre>
  <div class="status">
    <span>task: <b id="task">—</b></span>
    <span>stack: <b id="stack">[]</b></span>
    <span>latest: <b id="latest">—</b></span>
    <span>words: <b id="wordCount">0</b></span>
  </div>
</section>

<section class="input-area">
  <div class="prompt">
    <div class="prompt-label">k&gt;</div>
    <textarea id="source" spellcheck="false" autofocus>3 4 + .s</textarea>
  </div>
  <div class="controls">
    <button class="primary" id="run">Run</button>
    <button id="resume">Resume paused task</button>
    <select id="example" title="Insert a README example into the input area">
      <option value="">Insert README example…</option>
      <option value="seed">Bare kernel / words</option>
      <option value="grow">Grow a host word</option>
      <option value="colon">Colon definition</option>
      <option value="capture">Captured binding</option>
      <option value="pause">Pause / resume</option>
      <option value="input">Context-sensitive input</option>
      <option value="browser">Browser as host</option>
    </select>
    <button id="reset">Reset VM</button>
    <button id="clear">Clear transcript</button>
    <span class="hint">Ctrl+Enter runs · examples are inserted, not auto-run</span>
  </div>
</section>
</main>

<script type="module">
import { VM, KernelError } from "https://cdn.jsdelivr.net/gh/hcchengithub/project-k@master/js/projectk.js";
window.VM = VM;

const $ = id => document.getElementById(id);
let vm;
let paused = [];
let lastTask = null;

function scrollBottom() {
  const out = $("output");
  out.scrollTop = out.scrollHeight;
}

function write(...parts) {
  $("output").textContent += parts.join(" ") + "\n";
  scrollBottom();
}

function echoSource(source) {
  const lines = source.replace(/\s+$/, "").split("\n");
  if (!lines.length || (lines.length === 1 && !lines[0])) return;
  write("k> " + lines[0]);
  for (const line of lines.slice(1)) write(".. " + line);
}

const EXPLORER = String.raw`
code :
  vm.begin(vm.input.read())
end-code

code immediate
  vm.latest.immediate = true
end-code
immediate

code ;
  vm.finish()
end-code
immediate

code pick
  vm.push(vm.peek(vm.pop()))
end-code

code roll
  vm.push(vm.pop(vm.pop()))
end-code

: dup 0 pick ;
: over 1 pick ;
: swap 1 roll ;

code drop
  vm.pop()
end-code

code +
  const b = vm.pop(), a = vm.pop()
  vm.push(a + b)
end-code

code *
  const b = vm.pop(), a = vm.pop()
  vm.push(a * b)
end-code

code .
  out(String(vm.pop()))
end-code

code .s
  out("[" + vm.dstack.map(v => typeof v === "string" ? JSON.stringify(v) : String(v)).join(", ") + "]")
end-code

code words
  out([...vm.words.keys()].join(" "))
end-code

code see
  const name = vm.input.read()
  const word = vm.tick(name)
  if (word === null) throw new KernelError("Unknown word: " + name)
  out(String(word))
  out(word.source || "(" + word.action.map(String).join(", ") + ")")
end-code

code s"
  let text = vm.input.read('"')
  if (text.startsWith(" ")) text = text.slice(1)
  if (vm.compiling) vm.literal(text)
  else vm.push(text)
end-code
immediate

code pause
  yield vm.pause()
end-code
`;

function refresh(task = lastTask) {
  $("stack").textContent = "[" + vm.dstack.map(v => typeof v === "string" ? JSON.stringify(v) : String(v)).join(", ") + "]";
  $("latest").textContent = vm.latest ? vm.latest.name : "—";
  $("wordCount").textContent = String(vm.words.size);
  $("task").textContent = task ? task.status : "—";
  $("resume").disabled = paused.length === 0;
}

function resetVM() {
  paused.forEach(t => { try { t.cancel(); } catch {} });
  paused = [];
  lastTask = null;
  vm = new VM({ out: write, KernelError });
  window.vm = vm;
  vm.dictate(EXPLORER);
  write("Project K ready.");
  write("Teaching vocabulary grown from the two seed words: code end-code");
  write("Type Forth below. Try: 12 3 + .s");
  refresh();
}

function runSource() {
  const source = $("source").value;
  if (!source.trim()) return;
  echoSource(source);
  try {
    const task = vm.dictate(source);
    lastTask = task;
    if (task.status === "paused") {
      paused.push(task);
      write("[paused] use Resume paused task to continue");
    }
  } catch (error) {
    write(error.name + ": " + error.message);
  }
  refresh();
  $("source").value = "";
  $("source").focus();
}

function resumeLast() {
  const task = paused.pop();
  if (!task) return;
  write("k> [resume]");
  try {
    task.resume();
    lastTask = task;
    if (task.status === "paused") {
      paused.push(task);
      write("[paused again]");
    }
  } catch (error) {
    write(error.name + ": " + error.message);
  }
  refresh(task);
}

const examples = {
seed: `words`,
grow: `code double
  vm.push(vm.pop() * 2)
end-code
21 double .s`,
colon: `: square dup * ;
12 square .s
see square`,
capture: `: square dup * ;
: old-square 6 square ;
code square
  vm.push(99)
end-code
old-square square .s`,
pause: `: journey 1 pause 2 ;
journey`,
input: `code text
  const value = vm.input.read("|").trimStart()
  if (vm.compiling) vm.literal(value)
  else vm.push(value)
end-code
immediate
: greeting text Hello from context-sensitive input!| ;
greeting .`,
browser: `code title
  document.title = vm.pop()
end-code
s" Project K owns this browser tab" title`
};

$("run").onclick = runSource;
$("resume").onclick = resumeLast;
$("reset").onclick = resetVM;
$("clear").onclick = () => {
  $("output").textContent = "";
  write("Transcript cleared.");
};
$("example").onchange = event => {
  const value = examples[event.target.value];
  if (value) {
    $("source").value = value;
    $("source").focus();
    $("source").select();
  }
  event.target.value = "";
};
$("source").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.ctrlKey) {
    e.preventDefault();
    runSource();
  }
});

resetVM();
$("source").focus();
</script>
</body>
</html>
